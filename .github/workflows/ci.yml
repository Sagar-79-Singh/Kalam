name: Checks

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: TypeScript, streaming, and SQLite
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Production frontend build
        working-directory: frontend
        run: npm run build
      - name: Go backend tests
        run: go test -tags headless -race ./...
      - name: Go vet
        run: go vet -tags headless ./...
